include "backend.conf"
include "path-mapping.conf"

# This is the main configuration file for the application.
# ~~~~~

appName=entity-resolver

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.entityresolver.module.EntityResolverModule"

# Session Timeout
# ~~~~
# The default session timeout for the app is 15 minutes (900seconds).
# Updating this is the responsibility of the app - it must issue a new cookie with each request or the session will
# timeout 15 minutes after login (regardless of user activity).
# session.maxAge=900

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
# - Secret key is already provided by Bootstrap

# Session configuration
# ~~~~~
application.session.httpOnly=false

application.session.secure=false

# The application languages
# ~~~~~
play.i18n.langs=["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router=prod.Routes


# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and 
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule. 


# Evolutions
# ~~~~~
# You can disable evolutions if needed
# evolutionplugin=disabled

# Metrics plugin settings - graphite reporting is configured on a per env basis
metrics.enabled = true

mongodb {
  uri = "mongodb://localhost:27017/entity-resolver"
}

# Microservice specific config
auditing.enabled=true

microservice {
    metrics {
        gauges {
          interval = "15 minutes"
        }
    }

    services {

        auth {
            host=localhost
            port=8500
        }

        auth-login-api {
            host = localhost
            port = 8585
        }

        preferences {
            host=localhost
            port=8025
            circuitBreaker {
                numberOfCallsToTriggerStateChange = 30
                unavailablePeriodDurationInSeconds = 60
                unstablePeriodDurationInSeconds = 60
            }
        }

        enrolment-store-proxy {
            host = localhost
            port = 7775
        }
    }
}

akka.http {
  host-connection-pool {
    # The maximum number of parallel connections that a connection pool to a
    # single host endpoint is allowed to establish. Must be greater than zero.s
    max-connections = 32
    # The maximum number of open requests accepted into the pool across all
    # materializations of any of its client flows.
    # Protects against (accidentally) overloading a single pool with too many client flow materializations.
    # Note that with N concurrent materializations the max number of open request in the pool
    # will never exceed N * max-connections * pipelining-limit.
    # Must be a power of 2 and > 0!
    max-open-requests = 128
  }
}