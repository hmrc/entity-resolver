pathMapping = [
  # POST using this is deprecated - replaced with preferences/pending-email
  # GET using this is still valid
  {
    regex = "preferences"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s"
    auditIds = true
  },
  {
    regex = "preferences/pending-email"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/pending-email"
  },
  # DEPRECATED, use optin/optout/email-language
  {
    regex = "preferences/terms-and-conditions"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/terms-and-conditions"
    resolveIds = true
  },
  # DEPRECATED, use optin/optout/email-language
  {
    regex = "preferences/regime/terms-and-conditions"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/terms-and-conditions"
    resolveIds = true
  },
  {
    regex = "preferences/optin"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/optin"
    resolveIds = true
  },
  {
    regex = "preferences/email-language"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/email-language"
    resolveIds = true
  },
  {
    regex = "preferences/regime/optin"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/optin"
    resolveIds = true
  },
  {
    regex = "preferences/regime/optout"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/optout"
    resolveIds = true
  },
  {
    regex = "preferences/regime/email-language"
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s/email-language"
    resolveIds = true
  },
  {
    regex = """portal/preferences/sa/([a-z|0-9|-]*)"""
    taxIdExtraction {
      method = "ReadIdFromPath"
      idType = "sautr"
    }
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s"
  },
  {
    regex = """portal/preferences/paye/([A-Z|0-9]*)"""
    taxIdExtraction {
      method = "ReadIdFromPath"
      idType = "nino"
    }
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/%s"
  },
   {
        regex = "portal/preferences/itsa/([a-z|A-Z|0-9|-]*)"
        taxIdExtraction {
          method = "ReadIdFromPath"
          idType = "HMRC-MTD-IT"
        }
        serviceName = "preferences"
        destinationUrlPattern = "/preferences/%s"
   },
  {
    regex = "portal/preferences/email"
    taxIdExtraction {
      method = "PassThrough"
    }
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/email"
  },
  {
    regex = "preferences/email"
    taxIdExtraction {
      method = "PassThrough"
    }
    serviceName = "preferences"
    destinationUrlPattern = "/preferences/email"
  }
]